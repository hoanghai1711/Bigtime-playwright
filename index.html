<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Automation Test Tool</title>
  <style>
    body {
      font-family: Consolas, monospace;
      padding: 20px;
    }
    h2 {
      color: #1a3d8f;
      margin-bottom: 10px;
    }
    pre {
      background: #111;
      color: #0f0;
      padding: 15px;
      height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h2>Automation Test Tool - Playwright</h2>
  <pre id="log">💤 Đang chờ app load...</pre>

  <script>
    const { ipcRenderer } = require('electron');

    ipcRenderer.on('log', (event, data) => {
      const logEl = document.getElementById('log');
      logEl.textContent += '\n' + data;
    });
  </script>
</body>
</html>
