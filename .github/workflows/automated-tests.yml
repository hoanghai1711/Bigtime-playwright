name: HRM Automation Tests v4

on:
  push:
    branches: [develop, main, feature/**]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * *'  # Daily at 2AM

env:
  NODE_ENV: test
  URL_BIGTIME: https://bigtime-stg-2.bigapptech.vn/login
  
  # Database - using GitHub Secrets
  DB_HOST: 160.187.38.101
  DB_PORT: 3306
  DB_NAME: testing_staging_tpd
  DB_USER: bigtime_tpd_upgrade_user
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  
  # Test Users - using GitHub Secrets
  ADMIN_USERNAME: info@bigapptech.vn
  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
  EMPLOYEE_USERNAME: nhansu@gmail.com
  EMPLOYEE_PASSWORD: ${{ secrets.EMPLOYEE_PASSWORD }}
  MANAGER_USERNAME: quanlynhansu@gmail.com
  MANAGER_PASSWORD: ${{ secrets.MANAGER_PASSWORD }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      test_prefix: ${{ steps.setup.outputs.test_prefix }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name:  Generate test identifiers
      id: setup
      run: |
        RUN_PREFIX="test_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        echo "test_prefix=${RUN_PREFIX}" >> $GITHUB_OUTPUT
        echo "TEST_PREFIX=${RUN_PREFIX}" >> $GITHUB_ENV

  run-tests:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name:  Checkout code
      uses: actions/checkout@v4
    
    - name:  Cache node modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.npm
          node_modules
          ~/.cache/ms-playwright
        key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
    
    - name: ⎔ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name:  Install dependencies
      run: npm ci
    
    - name:  Install Playwright
      run: npx playwright install --with-deps chromium
    
    - name:  Run all tests
      env:
        TEST_PREFIX: ${{ needs.setup.outputs.test_prefix }}
        TEST_RUN_ID: ${{ github.run_id }}
      run: |
        echo "Test Prefix: ${TEST_PREFIX}"
        echo "Run ID: ${TEST_RUN_ID}"
        
        # Chạy tests với data isolation
        npm test 2>&1 | tee test-output.log
        
        # Hoặc chạy riêng từng loại test
        # npx playwright test --reporter=html,line --workers=2
    
    - name:  Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-${{ github.run_id }}
        path: |
          playwright-report/
          test-results/
        retention-days: 30
    
    - name:  Upload screenshots on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: failure-screenshots-${{ github.run_id }}
        path: screenshots/
        retention-days: 30
    
    - name:  Upload test logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-${{ github.run_id }}
        path: |
          test-output.log
          server.log
        retention-days: 14

  cleanup:
    runs-on: ubuntu-latest
    if: always()
    needs: run-tests
    
    steps:
    - name:  Cleanup test data in database
      env:
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      run: |
        # Cleanup test data từ database
        echo "Cleaning up test data with prefix: ${{ needs.setup.outputs.test_prefix }}"
        
        # Cài mysql client
        sudo apt-get update
        sudo apt-get install -y mysql-client
        
        # Xóa test data cũ
        mysql -h ${{ env.DB_HOST }} -P ${{ env.DB_PORT }} -u ${{ env.DB_USER }} -p$DB_PASSWORD ${{ env.DB_NAME }} << EOF
        DELETE FROM users WHERE code LIKE '${{ needs.setup.outputs.test_prefix }}_%';
        DELETE FROM leave_managements WHERE year > 2026 AND created_at > DATE_SUB(NOW(), INTERVAL 2 HOUR);
        EOF 2>/dev/null || true
    
    - name:  Create summary report
      if: always()
      run: |
        echo "# Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Workflow:** ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
        echo "**Run ID:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
        echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "- Playwright Report" >> $GITHUB_STEP_SUMMARY
        echo "- Test Screenshots (if any)" >> $GITHUB_STEP_SUMMARY
        echo "- Test Logs" >> $GITHUB_STEP_SUMMARY