# .github/workflows/hrm-server-ci.yml
name: HRM Server Tests (Real Database)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * *'  # 8AM hàng ngày
  workflow_dispatch:  # Cho phép chạy thủ công

jobs:
  test-with-real-db:
    runs-on: ubuntu-latest
    timeout-minutes: 45  
    
    
    
    env:
      NODE_ENV: test
      URL_BIGTIME: https://bigtime-stg-2.bigapptech.vn/login
      DB_HOST: 160.187.38.101
      DB_PORT: 3306
      DB_NAME: testing_staging_tpd
      DB_USER: bigtime_tpd_upgrade_user
      DB_PASSWORD: QO3AgAR258
      ADMIN_USERNAME: info@bigapptech.vn
      ADMIN_PASSWORD: 12345678@Bat
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v3
    
    - name: ⎔ Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name:  Install dependencies
      run: npm ci
    
    - name:  Install Playwright browsers
      run: npx playwright install --with-deps chromium
    
    - name:  Test database connection
      run: |
        # Kiểm tra kết nối đến database server
        echo "Testing connection to database server..."
        
        # Cài mysql client để test
        sudo apt-get update
        sudo apt-get install -y mysql-client
        
        # Test connection (ẩn password)
        mysql -h $DB_HOST -P $DB_PORT -u $DB_USER -p$DB_PASSWORD -e "SELECT 1;" $DB_NAME && echo "✅ Database connection successful"
        
        # Kiểm tra có thể đọc/ghi không
        mysql -h $DB_HOST -P $DB_PORT -u $DB_USER -p$DB_PASSWORD $DB_NAME -e "SHOW TABLES LIMIT 5;"
    
    - name:  Start application (nếu cần)
      run: |
        # Nếu ứng dụng của bạn cần start server
        # npm start &
        # sleep 15
        # curl -f http://localhost:3000/health || true
        echo "Skipping app start - using existing server"
    
    - name:  Run tests with real database
      run: |
        echo "Running tests against real database..."
        echo "Database: $DB_HOST:$DB_PORT/$DB_NAME"
        
        # Test với data isolation
        export TEST_RUN_ID="ci_${{ github.run_id }}_${{ github.run_number }}"
        export TEST_DATE_PREFIX=$(date +%m%d)
        
        # Chạy tests tuần tự để tránh data conflict
        npx playwright test tests/login.spec.ts --reporter=line --workers=1
        npx playwright test tests/employee.spec.ts --reporter=line --workers=1
        npx playwright test tests/leave/ --reporter=line --workers=1
        
        # Hoặc chạy tất cả với retry
        # npx playwright test --reporter=html --workers=2 --retries=2
    
    - name:  Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ github.run_id }}
        path: |
          playwright-report/
          test-results/
          screenshots/
        retention-days: 30