name: HRM Automation CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright-tests:
    name: 🧪 Playwright Tests
    runs-on: ubuntu-latest

    env:
      CI: true
      NODE_ENV: test
      URL_BIGTIME: ${{ secrets.URL_BIGTIME }}
      DB_HOST: mock
      DB_PORT: 3306
      DB_NAME: mock
      DB_USER: mock
      DB_PASSWORD: mock
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      EMPLOYEE_USERNAME: ${{ secrets.EMPLOYEE_USERNAME }}
      EMPLOYEE_PASSWORD: ${{ secrets.EMPLOYEE_PASSWORD }}
      MANAGER_USERNAME: ${{ secrets.MANAGER_USERNAME }}
      MANAGER_PASSWORD: ${{ secrets.MANAGER_PASSWORD }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📦 Install Allure dependencies
        run: npm install --save-dev allure-playwright

      - name: 🎭 Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: 📦 Install Allure CLI
        run: npm install -g allure-commandline

      - name: ▶ Run Playwright tests
        run: |
          npx playwright test \
            --project=chromium \
            --workers=1 \
            --timeout=120000 \
            --reporter=line,html,allure-playwright

      - name: 📊 Generate Allure report
        if: always()
        run: |
          if [ -d "allure-results" ]; then
            allure generate allure-results --clean -o allure-report
            echo "✅ Allure report generated"
            # Kiểm tra nội dung report
            ls -la allure-report/
          else
            echo "❌ No test results found"
            ls -la
          fi

      - name: 📦 Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7

  deploy-report:
    name: 🚀 Deploy Report
    needs: playwright-tests
    runs-on: ubuntu-latest
    # Chỉ deploy khi test job thành công (thay vì always)
    if: needs.playwright-tests.result == 'success' || needs.playwright-tests.result == 'failure'

    steps:
      - name: 📥 Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: allure-report

      - name: 🔍 Check downloaded files
        run: |
          echo "📁 Current directory structure:"
          ls -la
          echo "📁 allure-report directory:"
          ls -la allure-report/

      - name: 🌍 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          # Để deploy vào thư mục gốc của GitHub Pages
          destination_dir: ./
          keep_files: false