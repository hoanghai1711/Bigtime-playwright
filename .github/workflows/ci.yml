name: Pages

permissions:
  contents: read
  pages: write
  id-token: write

on:
  push:
    branches: [ main, develop ]

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 250
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: BigTime Pre Version 1.0.14
      AUTHOR: hoanghai
      PLATFORM: Ubuntu
      BROWSER: Chromium, Edge, Firefox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20   

      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          EMPLOYEE_USERNAME: ${{ secrets.EMPLOYEE_USERNAME }}
          EMPLOYEE_PASSWORD: ${{ secrets.EMPLOYEE_PASSWORD }}
          EMPLOYEE2_USERNAME: ${{ secrets.EMPLOYEE2_USERNAME }}
          EMPLOYEE2_PASSWORD: ${{ secrets.EMPLOYEE2_PASSWORD }}
          MANAGER_TEAM_USERNAME: ${{ secrets.MANAGER_TEAM_USERNAME }}
          MANAGER_TEAM_PASSWORD: ${{ secrets.MANAGER_TEAM_PASSWORD }}

      - name: Upload Playwright report
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report   

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages   

    steps:
      - uses: actions/deploy-pages@v4
