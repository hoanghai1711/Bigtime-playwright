name: HRM Automation CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright-tests:
    name: 🧪 Playwright Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        
      - name: ⎔ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: 📦 Install dependencies
        run: npm ci
        
      - name: 🎭 Install Playwright
        run: npx playwright install chromium
        
      - name: 📦 Install Allure
        run: npm install -g allure-commandline
        
      - name: ▶ Run tests
        run: npx playwright test --project=chromium --reporter=list,html,allure-playwright
        
      - name: 📊 Generate Allure report
        if: always()
        run: |
          if [ -d "allure-results" ]; then
            allure generate allure-results --clean -o allure-report
          else
            mkdir -p allure-report
            echo '<html><body><h1>No test results</h1></body></html>' > allure-report/index.html
          fi

      - name: 📦 Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/

  deploy-report:
    name: 🚀 Deploy Report to GitHub Pages
    needs: playwright-tests
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: 📥 Download report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          
      - name: 📁 List downloaded files
        run: ls -la
          
      - name: 🏗️ Setup Pages
        uses: actions/configure-pages@v4
        
      - name: 📤 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
      - name: 🔗 Display Report URL
        run: |
          echo "✅ Report deployed successfully!"
          echo "🌐 Direct URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "📊 Allure Report: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure-report/"
          echo ""
          echo "📋 You can also find the URL in:"
          echo "   1. Repository Settings → Pages"
          echo "   2. GitHub Actions workflow run → 'deploy-report' job → 'Deploy to GitHub Pages' step"