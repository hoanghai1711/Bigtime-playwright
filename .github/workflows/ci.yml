name: HRM Automation CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright-tests:
    name: 🧪 Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: true
      NODE_ENV: test
      URL_BIGTIME: ${{ secrets.URL_BIGTIME }}

      DB_HOST: mock
      DB_PORT: 3306
      DB_NAME: mock
      DB_USER: mock
      DB_PASSWORD: mock

      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      EMPLOYEE_USERNAME: ${{ secrets.EMPLOYEE_USERNAME }}
      EMPLOYEE_PASSWORD: ${{ secrets.EMPLOYEE_PASSWORD }}

      MANAGER_USERNAME: ${{ secrets.MANAGER_USERNAME }}
      MANAGER_PASSWORD: ${{ secrets.MANAGER_PASSWORD }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: 📦 Install Allure CLI
        run: npm install -g allure-commandline

      - name: ▶ Run Playwright tests
        run: |
          npx playwright test \
            --project=chromium \
            --workers=1 \
            --timeout=120000 \
            --reporter=list,html,allure-playwright

      - name: 📊 Generate Allure report
        if: always()
        run: |
          if [ -d "allure-results" ]; then
            allure generate allure-results --clean -o allure-report
            echo "✅ Allure report generated"
          else
            echo "⚠️ No test results found"
            mkdir -p allure-report
            echo '<!DOCTYPE html><html><head><title>Test Results</title></head><body><h1>No test results available</h1><p>Check the test execution logs for details.</p></body></html>' > allure-report/index.html
          fi

      - name: 📦 Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            allure-report/
            allure-results/
            test-results/
            playwright-report/
          retention-days: 7

  deploy-report:
    name: 🌍 Deploy Test Report
    needs: playwright-tests
    # Luôn chạy job này sau khi playwright-tests hoàn thành (bất kể pass hay fail)
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Download test artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-${{ github.run_id }}-*
          merge-multiple: true

      - name: 🔍 Debug context
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Branch: ${{ github.ref_name }}"

      # Chỉ deploy khi là push event trên branch main hoặc develop, hoặc workflow_dispatch
      - name: 🌍 Deploy to GitHub Pages
        # Điều kiện: push event trên branch main hoặc develop, hoặc workflow_dispatch
        if: |
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
          github.event_name == 'workflow_dispatch'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: ./test-results
          keep_files: false
          force_orphan: true

      - name: ℹ️ Skip deployment info
        # Bước này chạy nếu điều kiện deploy không thỏa mãn
        if: |
          !((github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
          github.event_name == 'workflow_dispatch')
        run: |
          echo "ℹ️ Deployment skipped because:"
          echo "  - Current event: ${{ github.event_name }}"
          echo "  - Current ref: ${{ github.ref }}"
          echo "  - This deployment only runs on push to main/develop or workflow_dispatch"