name: HRM Automation CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright-tests:
    name: 🧪 Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: true
      NODE_ENV: test
      URL_BIGTIME: ${{ secrets.URL_BIGTIME }}

      DB_HOST: mock
      DB_PORT: 3306
      DB_NAME: mock
      DB_USER: mock
      DB_PASSWORD: mock

      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      EMPLOYEE_USERNAME: ${{ secrets.EMPLOYEE_USERNAME }}
      EMPLOYEE_PASSWORD: ${{ secrets.EMPLOYEE_PASSWORD }}

      MANAGER_USERNAME: ${{ secrets.MANAGER_USERNAME }}
      MANAGER_PASSWORD: ${{ secrets.MANAGER_PASSWORD }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: ▶ Run Playwright tests
        run: |
          npx playwright test \
            --project=chromium \
            --workers=1 \
            --timeout=120000 \
            --reporter=list,html,allure-playwright

      - name: 📊 Generate Allure report
        if: always()
        run: |
          if [ -d "allure-results" ]; then
            npx allure generate allure-results --clean -o allure-report
          else
            echo "No allure-results directory found. Skipping allure report generation."
          fi

      - name: 📦 Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}
          path: |
            allure-report/
            test-results/
            screenshots/
          retention-days: 14

  deploy-allure:
    name:  Deploy Allure Report
    needs: playwright-tests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest

    steps:
      - name:  Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}

      - name:  Generate Allure report (again, to ensure we have the latest)
        run: |
          if [ -d "allure-results" ]; then
            npx allure generate allure-results --clean -o allure-report
          else
            echo "No allure-results directory found. Skipping allure report generation."
            exit 1
          fi

      - name:  Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: ./allure