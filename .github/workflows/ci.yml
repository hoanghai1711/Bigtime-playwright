name: HRM Automation CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
     
      CI: true
      NODE_ENV: test

    
      URL_BIGTIME: ${{ secrets.URL_BIGTIME }}

     
      DB_HOST: mock
      DB_PORT: 3306
      DB_NAME: mock
      DB_USER: mock
      DB_PASSWORD: mock

      # Test accounts
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      EMPLOYEE_USERNAME: ${{ secrets.EMPLOYEE_USERNAME }}
      EMPLOYEE_PASSWORD: ${{ secrets.EMPLOYEE_PASSWORD }}
      MANAGER_USERNAME: ${{ secrets.MANAGER_USERNAME }}
      MANAGER_PASSWORD: ${{ secrets.MANAGER_PASSWORD }}

    steps:
      - name:  Checkout code
        uses: actions/checkout@v4

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name:  Install dependencies
        run: npm ci

      - name:  Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (CI mode)
        run: |
          echo " Running tests in CI mode"
          echo "CI=$CI"
          echo "NODE_ENV=$NODE_ENV"

          npx playwright test \
            --project=chromium \
            --workers=1 \
            --timeout=120000 \
            --reporter=line,html

      - name:  Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            screenshots/
          retention-days: 14
